<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jogo dos Erros – Segurança do Trabalho</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b1320;--pn:#14213a;--ink:#eef2f8;--mu:#9fb0cc;--y:#ffcc00;--r:#e5484d;--g:#2fbf71;--b:#2f7de1;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1320}}
*{box-sizing:border-box}
html,body{margin:0;background:radial-gradient(1000px 500px at 50% -5%,#22365c,var(--bg) 65%) fixed;color:var(--ink);font:16px/1.45 Barlow,system-ui,sans-serif}
h1,h2,b,button,.ft{font-family:"Barlow Condensed",Impact,sans-serif}
.app{max-width:1180px;margin:0 auto;padding:12px}
.banner{background:var(--y);color:#111;border:4px solid #111;border-radius:6px;text-align:center;padding:2px 10px 8px;position:relative;box-shadow:0 8px 24px #0008}
.banner:before,.banner:after{content:"";display:block;height:12px;margin:0 -10px;background:repeating-linear-gradient(-45deg,#111 0 14px,var(--y) 14px 28px)}
.banner:before{margin-bottom:6px}.banner:after{margin-top:6px;display:none}
.banner h1{margin:0;font-size:clamp(34px,7vw,68px);line-height:1;font-weight:800;letter-spacing:.03em;text-transform:uppercase}
.banner p{margin:0;font-weight:600;font-size:clamp(14px,2.4vw,19px)}
.grid{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(300px,1fr);gap:14px;margin-top:14px;align-items:start}
.scene{position:relative;border:6px solid #111;outline:3px solid var(--y);border-radius:6px;overflow:hidden;background:#0a0f18;box-shadow:0 14px 40px #000a}
svg{display:block;width:100%;height:auto}
#svg{cursor:crosshair}
.hit{fill:transparent}
.cap{background:#111;color:var(--y);font:800 clamp(16px,2.6vw,22px) "Barlow Condensed",sans-serif;text-align:center;padding:8px;margin-top:3px;letter-spacing:.04em;border-radius:0 0 6px 6px;text-transform:uppercase}
.hud{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.hud div{background:var(--pn);border-radius:6px;padding:6px 10px;border-bottom:3px solid var(--y)}
.hud small{display:block;color:var(--mu);font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.hud b{font-size:26px;font-weight:800;line-height:1.1}
.bar{height:10px;background:#050a12;border-radius:5px;overflow:hidden;margin:10px 0 4px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--g),var(--y),var(--r));transition:clip-path .5s}
.lab{color:var(--mu);font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:10px 0}
.chip{display:flex;gap:8px;align-items:center;background:var(--pn);border-radius:6px;padding:5px 8px;font-size:14px;min-height:34px;opacity:.7}
.chip b{display:grid;place-items:center;flex:none;width:24px;height:24px;border-radius:50%;background:#0b1320;font-size:15px}
.chip.on{opacity:1;background:#12372a;border:1px solid var(--g)}.chip.on b{background:var(--g);color:#05140c}
.info{background:var(--pn);border-left:8px solid var(--b);border-radius:6px;padding:10px 14px;min-height:112px}
.info h2{margin:0 0 4px;font-size:24px;line-height:1.1}
.info p{margin:0;font-size:15px}
.nr{display:inline-block;background:var(--b);color:#fff;font:600 13px Barlow,sans-serif;padding:1px 8px;border-radius:3px;margin-right:6px}
.info.good{border-color:var(--g)}.info.good .nr{background:var(--g)}
.info.bad{border-color:var(--r)}.info.bad .nr{background:var(--r)}
.tools{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
button{font-weight:800;font-size:19px;letter-spacing:.04em;background:var(--y);color:#111;border:0;border-radius:6px;padding:10px 20px;cursor:pointer;text-transform:uppercase;transition:transform .12s}
button:active{transform:scale(.96)}button.alt{background:var(--pn);color:var(--ink);flex:1;padding:10px 12px;font-size:16px}
button:focus-visible{outline:3px solid #fff;outline-offset:2px}button:disabled{opacity:.4;cursor:default}
.overlay{position:absolute;inset:0;background:rgba(8,12,20,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;gap:12px}
.overlay h1{font-size:clamp(36px,7vw,64px);line-height:.95;margin:0;font-weight:800;text-transform:uppercase}
.overlay p{max-width:520px;color:var(--mu);margin:0}
.stars{font-size:40px;color:var(--y);letter-spacing:6px}
.badge{width:74px;height:74px}
.pulse{animation:p 1s ease-in-out 4}@keyframes p{50%{stroke-width:7}}
.shake{animation:s .35s}@keyframes s{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@media (prefers-reduced-motion:reduce){.pulse,.shake{animation:none}}
@media(max-width:860px){.grid{grid-template-columns:1fr}.scene.ovon #svg{display:none}.overlay{position:relative;min-height:400px}.app{padding:8px}}
@media(max-width:480px){.hud b{font-size:22px}.hud div{padding:5px 7px}.chips{grid-template-columns:1fr}.banner{border-width:3px}}

:root{--bg:#0b1e2b;--pn:#123247;--ink:#d9fff4;--mu:#8fc9bb;--y:#ffe45c;--g:#3ddc6b;--r:#e23b3b;--b:#7fd1ff;--m:#7ff0d0}
html,body,h1,h2,b,button,.cap,.nr,.chip,.lab{font-family:"Press Start 2P","Courier New",monospace!important}

.scene{border:3px solid #000;outline:2px solid rgba(255,210,60,.7);border-radius:0;box-shadow:0 0 0 2px rgba(255,210,60,.55),0 0 60px rgba(127,240,208,.35),0 0 140px rgba(0,0,0,.6)}
.scene:after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.13) 0 1px,transparent 1px 3px)}
.cap{font-size:clamp(8px,1.8vw,11px);color:var(--m);background:#000;border-radius:0;text-shadow:2px 2px 0 #000;letter-spacing:0;padding:10px 6px}
.hud div,.chip,.info{border-radius:0;box-shadow:0 0 0 2px #000}
.hud div{border-bottom:3px solid var(--m)}
.hud small{font-size:7px;letter-spacing:0;color:var(--mu)}
.hud b{font-size:16px;font-weight:400;text-shadow:2px 2px 0 #000}
.bar{border-radius:0;box-shadow:0 0 0 2px #000}.lab{font-size:7px;letter-spacing:0}
.chip{font-size:8px;line-height:1.5;min-height:38px}.chip b{border-radius:0;font-size:9px;width:22px;height:22px;font-weight:400}
.chip.on{border-color:var(--g)}.chip.on b{background:var(--g)}
.info{min-height:130px;border-left-width:6px}.info h2{font-size:12px;line-height:1.5;font-weight:400;text-shadow:2px 2px 0 #000;color:var(--y)}.info p{font-size:9px;line-height:1.8}
.nr{font-size:7px;font-weight:400;border-radius:0;padding:3px 6px;margin-right:6px;color:#05140c}.info.bad .nr{color:#fff}
button{font-size:11px;font-weight:400;letter-spacing:0;border-radius:0;color:#1b2433;background:var(--y);box-shadow:0 4px 0 #b8972a,0 0 0 2px #000;padding:12px 16px;text-transform:uppercase}
button:active{transform:translateY(3px);box-shadow:0 1px 0 #b8972a,0 0 0 2px #000}
button.alt{font-size:8px;background:var(--pn);color:var(--m);box-shadow:0 4px 0 #0a1e2c,0 0 0 2px #000;padding:11px 8px}
.overlay{background:rgba(5,14,24,.94)}.overlay h1{font-size:clamp(18px,4.4vw,34px);line-height:1.4;font-weight:400;color:var(--y);text-shadow:3px 3px 0 #000}
.overlay p{font-size:9px;line-height:1.9;color:var(--m)}.stars{font-size:30px;text-shadow:3px 3px 0 #000}
.pulse{stroke:var(--y)}
@media(max-width:480px){.hud b{font-size:13px}.hud small{font-size:6px}.info p{font-size:8px}.banner h1{font-size:17px}button.alt{font-size:7px;padding:10px 4px}}
#cv{display:none;width:100%;height:auto;touch-action:none;cursor:ew-resize}
.overlay{background:radial-gradient(circle at 50% 22%,#1d5170,#050e18 75%)}
.overlay:before{content:"";position:absolute;left:0;right:0;top:0;height:10px;background:repeating-linear-gradient(-45deg,#111 0 10px,var(--y) 10px 20px)}
.fl span{display:inline-block;font-size:34px;margin:0 6px;animation:bob 1.6s ease-in-out infinite}
.fl span:nth-child(2){animation-delay:.2s}.fl span:nth-child(3){animation-delay:.4s}.fl span:nth-child(4){animation-delay:.6s}.fl span:nth-child(5){animation-delay:.8s}
@keyframes bob{50%{transform:translateY(-10px)}}
.mini{font-size:7px!important;color:var(--mu)!important}
.hud div{background:linear-gradient(180deg,#17415a,var(--pn))}
.chip b{font-size:15px}.chip.on{background:linear-gradient(90deg,#12503a,#12372a)}
@media(max-width:860px){.scene.ovon #cv{display:none!important}}
@media (prefers-reduced-motion:reduce){.fl span{animation:none}}
.scene:before{content:"";position:absolute;inset:0;pointer-events:none;z-index:2;box-shadow:inset 0 0 90px rgba(0,0,0,.5)}
</style>
</head>

</aside>
</div>

const WI=h=>{const i=new Image();i.src='data:image/svg+xml,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="-34 -36 68 96" width="136" height="192">${P(0,0,{hat:h?1:0,c:'#e8742a',h:[[-22,12],[22,12]]})}</svg>`);return i};

function chud(){$('hLv').textContent=(ci+1)+'/'+CAMP.length;$('hSc').textContent=score;$('lT').textContent='Meta';$('hT').textContent=C.got+'/'+cl.goal;$('hL').textContent='♥'.repeat(lives)+'♡'.repeat(3-lives);$('risk').style.clipPath=`inset(0 ${100*Math.min(1,C.got/cl.goal)}% 0 0)`;$('bHint').disabled=true;$('bHint').textContent='Dica (—)';$('cap').textContent='Chuva de EPIs · '+cl.n;
$('chips').innerHTML=GOOD.map((d,k)=>`<div class="chip ${C.kit.has(k)?'on':''}"><b>${d[0]}</b><span>${C.kit.has(k)?d[1]:'?'}</span></div>`).join('')}
function catchStart(n){mode='catch';clearInterval(tm);run=false;cn=n;cl=CL[n];lives=3;C={it:[],fx:[],kit:new Set(),got:0,x:400,hat:false,inv:0,sp:1.2,t:0};tgt=400;cr=true;svg.style.display='none';cv.style.display='block';ov.style.display='none';sc.classList.remove('ovon');
show(`<h2>Chuva de EPIs: ${cl.n}</h2><p>Pegue <b>${cl.goal}</b> EPIs ✔ e desvie de tijolos e produtos perigosos ✖. Capture o <b>capacete</b> para absorver 1 impacto. Setas ou arraste para mover.</p>`);
chud();cancelAnimationFrame(craf);clast=performance.now();craf=requestAnimationFrame(cloop)}
function hit(o){const d=(o.bad?BAD:GOOD)[o.k];
if(!o.bad){C.got++;score+=50;C.kit.add(o.k);if(o.k==0)C.hat=true;let x='';if(o.k==0)x=' Capacete colocado: ele absorve 1 impacto!';if(o.k==5&&lives<3){lives++;x=' +1 vida!'}
sfx(660,.08,'square',.08);setTimeout(()=>sfx(990,.12,'square',.08),80);C.fx.push({x:o.x,y:o.y,t:.9,s:'+50',c:'#7ff0d0'});burst(o.x,o.y,'#7ff0d0');show(`<h2>${d[0]} ${d[1]}</h2><p><span class="nr">${d[2]}</span>${d[3]}${x}</p>`,'good');chud();if(C.got>=cl.goal)end(true)}
else if(C.inv>0){}
else if(C.hat){C.hat=false;C.inv=1;sfx(220,.15,'square',.1);C.fx.push({x:C.x,y:360,t:1,s:'CAPACETE!',c:'#7fd1ff'});burst(C.x,370,'#7fd1ff');show(`<h2>O capacete te salvou!</h2><p><span class="nr">NR-6</span>${d[0]} ${d[1]}: ${d[3]} O capacete absorveu o impacto, mas pegue outro.</p>`,'good');chud()}
else{lives--;C.inv=1.4;sfx(110,.3,'sawtooth',.12);sc.classList.remove('shake');void sc.offsetWidth;sc.classList.add('shake');C.fx.push({x:C.x,y:360,t:1,s:'AI!',c:'#e23b3b'});burst(C.x,380,'#e23b3b');show(`<h2>${d[0]} ${d[1]}</h2><p><span class="nr">${d[2]}</span>${d[3]} Você perdeu uma vida.</p>`,'bad');chud();if(lives<=0)end(false)}}
function burst(x,y,c){C.pt=C.pt||[];for(let i=0;i<14;i++){const a=Math.random()*6.28,s=80+Math.random()*180;C.pt.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-120,l:.6+Math.random()*.4,c})}}
function cloop(ts){if(!cr)return;const dt=Math.min(.05,(ts-clast)/1000);clast=ts;
if(ck.ArrowLeft||ck.a)tgt-=480*dt;if(ck.ArrowRight||ck.d)tgt+=480*dt;tgt=Math.max(40,Math.min(760,tgt));C.x+=(tgt-C.x)*Math.min(1,dt*16);C.t+=dt;C.sp-=dt;C.inv=Math.max(0,C.inv-dt);
if(C.sp<=0){C.sp=cl.rate*(.7+Math.random()*.6);const bad=Math.random()<cl.bad,a=bad?BAD:GOOD;C.it.push({x:50+Math.random()*700,y:-30,v:cl.spd*(.8+Math.random()*.5),k:Math.random()*a.length|0,bad,w:Math.random()*6})}
for(const o of C.it){o.y+=o.v*dt;o.w+=dt*3;if(!o.dead&&cr&&Math.abs(o.x-C.x)<40&&o.y>335&&o.y<430){o.dead=1;hit(o)}}
C.it=C.it.filter(o=>!o.dead&&o.y<480);C.fx=C.fx.filter(f=>(f.t-=dt)>0);C.pt=(C.pt||[]).filter(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=600*dt;return(p.l-=dt)>0});cdraw();if(cr)craf=requestAnimationFrame(cloop)}
function cdraw(){const g=cx,gr=g.createLinearGradient(0,0,0,450);gr.addColorStop(0,cl.bg[0]);gr.addColorStop(1,cl.bg[1]);g.fillStyle=gr;g.fillRect(0,0,800,450);
const mg2=g.createRadialGradient(660,90,5,660,90,130);mg2.addColorStop(0,'rgba(255,240,200,.5)');mg2.addColorStop(1,'rgba(255,240,200,0)');g.fillStyle=mg2;g.fillRect(520,0,280,240);g.fillStyle='#fff4d6';g.beginPath();g.arc(660,90,20,0,7);g.fill();
g.fillStyle='rgba(255,255,255,.55)';for(let i=0;i<36;i++)g.fillRect((i*97)%800,(i*53)%240,2,2);
for(let L=0;L<2;L++)for(let i=0;i<12;i++){const w=64+((i*37)%46),hh=(L?100:165)+((i*53+L*29)%100),x=((i*85-C.t*(5+L*10))%1020+1020)%1020-110;g.fillStyle=L?'rgba(10,20,34,.55)':'rgba(180,210,235,.09)';g.fillRect(x,432-hh,w,hh);g.fillStyle=L?'rgba(255,228,92,.5)':'rgba(255,228,92,.18)';for(let r=0;r<hh/22-1;r++)for(let c=0;c<w/18-1;c++)if((i*7+r*3+c*5)%4==0)g.fillRect(x+8+c*18,432-hh+10+r*22,7,9)}
if(cn==4){g.strokeStyle='rgba(180,220,255,.35)';g.lineWidth=2;for(let i=0;i<40;i++){const x=(i*47+C.t*90)%800,y=(i*91+C.t*600)%450;g.beginPath();g.moveTo(x,y);g.lineTo(x-6,y+22);g.stroke()}}
const fg=g.createLinearGradient(0,432,0,450);fg.addColorStop(0,'#3a4658');fg.addColorStop(1,'#1c2330');g.fillStyle=fg;g.fillRect(0,432,800,18);for(let i=0;i<20;i++){g.fillStyle=i%2?'#ffe45c':'#111';g.fillRect(i*40,432,40,6)}g.fillStyle='rgba(255,255,255,.25)';g.fillRect(0,432,800,1);
g.fillStyle='rgba(0,0,0,.6)';g.fillRect(20,14,760,16);g.fillStyle='#7ff0d0';g.fillRect(23,17,754*Math.min(1,C.got/cl.goal),10);
g.font='34px "Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif';g.textAlign='center';g.textBaseline='middle';
for(const o of C.it){const gd=!o.bad;g.save();g.translate(o.x,o.y);g.strokeStyle=gd?'rgba(127,240,208,.28)':'rgba(255,80,80,.3)';g.lineWidth=4;g.lineCap='round';g.beginPath();g.moveTo(-7,-34);g.lineTo(-7,-62);g.moveTo(7,-30);g.lineTo(7,-52);g.stroke();
g.rotate(Math.sin(o.w)*.22);g.shadowColor=gd?'#7ff0d0':'#ff3b3b';g.shadowBlur=gd?20:24;g.font='46px "Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif';g.fillText((gd?GOOD:BAD)[o.k][0],0,3);g.shadowBlur=0;g.restore();
if(o.bad){g.fillStyle='#ffcc00';g.strokeStyle='#000';g.lineWidth=2;g.beginPath();g.moveTo(o.x+22,o.y-34);g.lineTo(o.x+34,o.y-12);g.lineTo(o.x+10,o.y-12);g.closePath();g.fill();g.stroke();g.fillStyle='#000';g.font='10px "Press Start 2P",monospace';g.fillText('!',o.x+22,o.y-17)}else{g.fillStyle='#7ff0d0';g.font='14px sans-serif';g.fillText('✦',o.x+26,o.y-24+Math.sin(o.w*2)*3)}}
g.fillStyle='rgba(0,0,0,.35)';g.beginPath();g.ellipse(C.x,436,32,7,0,0,7);g.fill();
if(!(C.inv>0&&((C.inv*12)|0)%2)){g.drawImage(C.hat?W1:W0,C.x-45,318,90,125)}
if(C.hat){g.strokeStyle='rgba(127,209,255,.8)';g.lineWidth=3;g.beginPath();g.arc(C.x,380,64,0,7);g.stroke()}
for(const p of C.pt||[]){g.globalAlpha=Math.max(0,p.l*1.6);g.fillStyle=p.c;g.fillRect(p.x,p.y,5,5)}g.globalAlpha=1;g.font='12px "Press Start 2P",monospace';g.textBaseline='alphabetic';for(const f of C.fx){g.fillStyle='#000';g.fillText(f.s,f.x+2,f.y-(1-f.t)*40+2);g.fillStyle=f.c;g.fillText(f.s,f.x,f.y-(1-f.t)*40)}}
const mv=e=>{const r=cv.getBoundingClientRect();tgt=(e.clientX-r.left)/r.width*800};
cv.addEventListener('pointerdown',e=>{music();mv(e)});cv.addEventListener('pointermove',e=>{if(e.buttons||e.pointerType==='mouse')mv(e)});
addEventListener('keydown',e=>{ck[e.key]=1;if(cr&&e.key.startsWith('Arrow'))e.preventDefault()});addEventListener('keyup',e=>{ck[e.key]=0});
function startC(i){ci=i;const c=CAMP[i];c.t==='err'?load(c.i):catchStart(c.n)}
function end(win){run=false;cr=false;cancelAnimationFrame(craf);clearInterval(tm);if(!win&&mode==='err')S[lv].items.forEach((it,k)=>{if(!it.ok&&!found.has(k))mark(it,'#ff9f1c','!')});hud();
const last=ci===CAMP.length-1,st=win?(lives===3?3:lives===2?2:1):0,nx=CAMP[ci+1];
ov.style.display='flex';sc.classList.add('ovon');
ov.innerHTML=win?`<div class="stars">${'★'.repeat(st)+'☆'.repeat(3-st)}</div><h1>${last?'Campanha concluída':'Fase concluída'}</h1><p>${last?`Você terminou com ${score} pontos. Lembre-se: todo trabalhador tem direito de recusar uma tarefa de risco grave e iminente.`:`Pontos: ${score}. Próxima fase: ${nx.t==='err'?'inspeção de '+S[nx.i].name:'chuva de EPIs'}.`}</p><button id="nx">${last?'Jogar de novo':'Próxima fase'}</button>`
:`<h1>${mode==='catch'?'Que pancada!':'Interdição'}</h1><p>${mode==='catch'?'Você levou pancadas demais. Pegue o capacete e desvie do que cai.':(time<=0?'O tempo acabou.':'Você apontou itens corretos demais.')+' Os riscos marcados com ! ficaram no local.'} Tente de novo.</p><button id="nx">Tentar de novo</button>`;
$('nx').onclick=()=>{if(win&&last){score=0;startC(0)}else startC(win?ci+1:ci)}}
$('bSkip').onclick=()=>startC(ci);
ov.innerHTML=`<div class="fl"><span>⛑️</span><span>🧤</span><span>🥽</span><span>🦺</span><span>🧯</span></div><h1>Inspetor de<br>Segurança</h1><p>Campanha de 10 fases: ache os erros nas inspeções e pegue EPIs na chuva de materiais, desviando de tijolos e produtos perigosos.</p><button id="go">Iniciar campanha</button><p class="mini">← → ou arraste para mover · M = música</p>`;
$('go').onclick=()=>{score=0;music();startC(0)};
time=S[0].time;hud();
